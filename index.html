.ok{border-color:var(--ok)!important;background:#3d7a4a33!important}.no{border-color:var(--no)!important;background:#a8402f33!important}

.tl{border-left:3px solid var(--c3);margin-left:8px;padding-left:16px}.tl .card{cursor:pointer;position:relative}.tl .card:before{content:"";position:absolute;left:-26px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--c2)}

const M=[
["Bab 1. Awal Kemerdekaan dan UUD 1945 (1945–1949)","<h4>Latar belakang</h4><p>Setelah Proklamasi 17 Agustus 1945, Indonesia butuh dasar hukum. Pada 18 Agustus 1945 PPKI mengesahkan UUD 1945 sebagai konstitusi tertulis pertama. Sifatnya sementara karena disusun dalam keadaan mendesak.</p><h4>Sistematika</h4><ul><li>Pembukaan: 4 alinea</li><li>Batang Tubuh: 16 bab, 37 pasal</li><li>Penjelasan: disusun Prof. Soepomo</li></ul><h4>Langkah PPKI</h4><p>Memilih Soekarno-Hatta, membentuk BKR dan KNIP. KNIP membantu tugas MPR, DPR, DPA sebelum terbentuk (Pasal IV Aturan Peralihan).</p><h4>Demokrasi awal</h4><ul><li>16 Okt 1945: Maklumat Wapres No. X, KNIP berwenang legislatif dan ikut menetapkan GBHN</li><li>17 Okt 1945: BP KNIP dibentuk</li><li>3 Nov 1945: Maklumat Pemerintah, rakyat bebas mendirikan partai (sekitar 40 partai)</li></ul>","PPKI, KNIP, Maklumat X, multipartai","UUD 1945 disahkan sehari setelah proklamasi, awalnya presidensial, lalu demokrasi dibuka lewat KNIP dan partai."],
["Bab 2. RIS dan UUD RIS 1949 (1949–1950)","<h4>Latar belakang</h4><p>Belanda masih berusaha menguasai Indonesia. Hasil Konferensi Meja Bundar (1949): Belanda menyerahkan kedaulatan dalam bentuk Republik Indonesia Serikat (federal), sehingga dibutuhkan UUD baru yang berlaku 27 Desember 1949.</p><h4>Penyerahan kedaulatan 27 Des 1949</h4><ul><li>Belanda: Ratu Juliana kepada Moh. Hatta</li><li>Yogyakarta: RI kepada RIS</li><li>Jakarta: Lovink kepada Sri Sultan HB IX</li></ul><h4>UUD RIS</h4><p>Mukadimah 4 alinea, 6 bab, 197 pasal. Bentuk negara federal, bentuk pemerintahan republik, sistem parlementer (PM kepala pemerintahan).</p><h4>Berakhirnya RIS</h4><p>Rakyat ingin bersatu. Maret 1950 Moh. Natsir mengajukan Mosi Integral. 17 Agustus 1950 RIS bubar, Indonesia kembali NKRI.</p>","KMB, federal, Mosi Integral, Natsir","RIS lahir dari KMB, tetapi federalisme tidak sesuai cita-cita persatuan sehingga dibubarkan 17 Agustus 1950."],
["Bab 3. UUDS 1950 dan Demokrasi Parlementer (1950–1959)","<h4>UUDS 1950</h4><p>Berlaku 17 Agustus 1950, 6 bab 146 pasal, bersifat sementara menunggu UUD tetap buatan Konstituante. Presiden kepala negara (simbolis), PM kepala pemerintahan, kabinet bertanggung jawab kepada DPR.</p><h4>Ciri</h4><p>Multipartai, kabinet mudah jatuh. Terjadi 7 kali pergantian kabinet: Natsir, Sukiman-Suwirjo, Wilopo, Ali I, Burhanuddin Harahap, Ali II, Djuanda.</p><h4>Pemilu 1955</h4><p>Pemilu pertama, memilih anggota DPR dan Konstituante.</p><h4>Menuju Dekrit</h4><ul><li>1 Des 1956: Hatta mundur sebagai Wapres</li><li>22 April 1959: Soekarno minta kembali ke UUD 1945</li><li>Konstituante buntu soal dasar negara, tiga kali voting gagal</li><li>5 Juli 1959: Dekrit Presiden</li></ul><p>Isi Dekrit: bubarkan Konstituante; UUD 1945 berlaku, UUDS 1950 tidak berlaku; bentuk MPRS dan DPAS.</p>","Konstituante, 7 kabinet, Pemilu 1955, Dekrit","Ketidakstabilan kabinet dan kebuntuan Konstituante mendorong Dekrit 5 Juli 1959."],
["Bab 4. Demokrasi Terpimpin (1959–1966)","<h4>Pengertian</h4><p>Sistem setelah Dekrit 1959, kekuasaan terpusat pada Soekarno. Demokrasi liberal dianggap demokrasi impor.</p><h4>Ciri</h4><ul><li>Kekuasaan presiden besar, partai dibatasi</li><li>Militer dan PKI menguat</li><li>NASAKOM: Nasionalisme, Agama, Komunisme</li></ul><h4>Kebijakan</h4><ul><li>MPRS dan DPAS dibentuk; Masyumi dan PSI dibubarkan</li><li>1963: TAP MPRS III/1963, presiden seumur hidup</li><li>Trikora (Irian Barat), Konfrontasi Malaysia</li><li>Politik Mercusuar: Monas, Asian Games 1962</li><li>Januari 1965 keluar dari PBB</li></ul><h4>Penyimpangan dan ekonomi</h4><p>DPR hasil Pemilu 1955 dibubarkan diganti DPR-GR, Manipol USDEK jadi GBHN, poros Jakarta-Peking-Moskow. Proyek besar mengabaikan rakyat sehingga terjadi inflasi dan hiperinflasi.</p>","NASAKOM, Mercusuar, presiden seumur hidup","Kekuasaan terpusat dan kebijakan keliru menimbulkan krisis politik dan ekonomi."],
["Bab 5. G30S/PKI (1965)","<h4>Peristiwa</h4><p>Terjadi malam 30 September sampai 1 Oktober 1965, dijelaskan dalam materi sebagai upaya menggulingkan pemerintah dan mengganti Pancasila.</p><h4>Korban (Pahlawan Revolusi)</h4><p>Ahmad Yani, Suprapto, M.T. Haryono, S. Parman, D.I. Panjaitan, Sutoyo, Pierre Tendean. Nasution selamat, putrinya Ade Irma gugur. Di Yogyakarta: Katamso dan Sugiyono.</p><h4>Dampak</h4><ul><li>Soekarno melemah, Soeharto menguat</li><li>PKI dibubarkan dan dilarang</li><li>Kekerasan massal, perkiraan 450.000 sampai lebih dari satu juta korban</li><li>Mahmilub mengadili Untung dan D.N. Aidit</li></ul><p>1 Oktober diperingati sebagai Hari Kesaktian Pancasila. Dalang peristiwa masih diperdebatkan sejarawan.</p>","Pahlawan Revolusi, Mahmilub, 1 Oktober","G30S menjadi titik balik berakhirnya Demokrasi Terpimpin."],
["Bab 6. Supersemar dan Peralihan Kekuasaan (1966–1968)","<h4>Latar belakang</h4><p>Krisis politik, ekonomi, keamanan. Mahasiswa menuntut Tritura: bubarkan PKI, bersihkan kabinet dari unsur G30S, perbaiki ekonomi.</p><h4>Supersemar</h4><p>Surat Perintah Sebelas Maret, ditandatangani Soekarno 11 Maret 1966, memberi wewenang kepada Letjen Soeharto memulihkan keamanan dan ketertiban.</p><h4>Dampak</h4><ul><li>12 Maret 1966: Soeharto membubarkan PKI</li><li>TAP MPRS IX/1966 mengukuhkan Supersemar</li><li>1967: Soeharto Pejabat Presiden</li><li>27 Maret 1968: Soeharto resmi Presiden, Orde Baru dimulai</li></ul>","Tritura, Supersemar, Orde Baru","Supersemar menjadi pintu peralihan kekuasaan dari Soekarno ke Soeharto."],
["Bab 7. Berakhirnya Orde Baru (1998)","<h4>Latar belakang</h4><p>Orde Baru (1966/67–1998) berakhir akibat krisis ekonomi, ketidakpuasan rakyat, demonstrasi mahasiswa menuntut reformasi, Tragedi Trisakti dan Kerusuhan Mei 1998.</p><h4>Peristiwa</h4><p>21 Mei 1998 Soeharto mundur dan B.J. Habibie menjadi Presiden.</p><h4>Dampak</h4><ul><li>Era Reformasi dimulai</li><li>Tuntutan demokrasi dan pembatasan kekuasaan presiden</li><li>Amandemen UUD 1945</li></ul>","Reformasi, Trisakti, Habibie","Krisis ekonomi dan tekanan rakyat mengakhiri Orde Baru."],
["Bab 8. Amandemen UUD 1945 (1999–2002)","<h4>Latar belakang</h4><p>UUD 1945 lama executive heavy: kekuasaan presiden besar, pengawasan lemah, pasal multitafsir, HAM terbatas.</p><h4>Lima kesepakatan dasar</h4><ol><li>Tidak mengubah Pembukaan</li><li>Mempertahankan NKRI</li><li>Mempertegas presidensial</li><li>Hal normatif masuk pasal</li><li>Perubahan secara adendum</li></ol><h4>Empat tahap</h4><ul><li><b>I, 19 Okt 1999:</b> masa jabatan presiden maksimal 2 kali 5 tahun; kekuasaan membentuk UU ke DPR</li><li><b>II, 18 Agt 2000:</b> Bab XA HAM (Pasal 28A–28J), otonomi daerah, TNI dan Polri dipisah, fungsi DPR, Pasal 36A–36C</li><li><b>III, 9 Nov 2001:</b> presiden dipilih langsung (Pasal 6A), MPR terdiri DPR dan DPD, pemakzulan, MK dan KY dibentuk</li><li><b>IV, 10 Agt 2002:</b> DPA dihapus, putaran kedua pilpres, triumvirat (Menlu, Mendagri, Menhan) Pasal 8 ayat 3, anggaran pendidikan minimal 20%, Pasal 33-34, Pasal 37</li></ul><h4>Dampak</h4><p>Positif: demokrasi kuat, kekuasaan dibatasi, checks and balances, HAM luas. Negatif: biaya politik tinggi, politik uang, polarisasi, tumpang tindih kewenangan.</p>","adendum, checks and balances, MK, KY","Empat amandemen membatasi presiden dan memperkuat demokrasi serta HAM."],
["Bab 9. Rangkuman Konstitusi","<table><tr><th>Periode</th><th>Konstitusi</th><th>Bentuk</th><th>Sistem</th></tr><tr><td>18 Agt 1945–27 Des 1949</td><td>UUD 1945</td><td>Kesatuan</td><td>Presidensial</td></tr><tr><td>27 Des 1949–17 Agt 1950</td><td>UUD RIS</td><td>Federal</td><td>Parlementer</td></tr><tr><td>17 Agt 1950–5 Juli 1959</td><td>UUDS 1950</td><td>Kesatuan</td><td>Parlementer</td></tr><tr><td>5 Juli 1959–kini</td><td>UUD 1945</td><td>Kesatuan</td><td>Presidensial</td></tr></table><p>Lihat halaman Timeline untuk urutan 23 peristiwa penting.</p>","urutan konstitusi","Pola: UUD 1945 → RIS → UUDS 1950 → UUD 1945 (diamandemen)."],
["Bab 10. Istilah Penting","<ul><li><b>Konstitusi</b>: hukum dasar negara</li><li><b>Federal</b>: negara serikat dari beberapa negara bagian</li><li><b>Presidensial</b>: presiden kepala negara sekaligus pemerintahan</li><li><b>Parlementer</b>: PM kepala pemerintahan, kabinet bertanggung jawab ke parlemen</li><li><b>Konstituante</b>: lembaga penyusun UUD baru</li><li><b>Dekrit</b>: keputusan presiden mengatasi masalah ketatanegaraan</li><li><b>Amandemen</b>: perubahan isi konstitusi, <b>adendum</b>: dengan menambahkan naskah</li><li><b>Checks and balances</b>: saling mengawasi antarlembaga</li><li><b>Executive heavy</b>: eksekutif terlalu dominan</li><li><b>Impeachment</b>: pemberhentian presiden sebelum masa jabatan berakhir</li><li><b>Otonomi daerah</b>: hak daerah mengurus pemerintahannya sendiri</li></ul>","istilah","Kuasai istilah agar mudah menjawab soal konsep."]];
